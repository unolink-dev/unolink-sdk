name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: Contract files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Every schema, scenario and canned response is valid JSON; every schema is valid draft 2020-12
        run: |
          pip install --quiet "jsonschema>=4.23"
          python - <<'PY'
          import glob, json
          from jsonschema import Draft202012Validator
          for f in sorted(glob.glob("contract/**/*.json", recursive=True)):
              data = json.load(open(f))
              if f.startswith("contract/schemas/"):
                  Draft202012Validator.check_schema(data)
          print("contract OK")
          PY

  android:
    name: Android SDK (tests, lint, samples)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :unolink:testDebugUnitTest :unolink:lintDebug :samples:kotlin:assembleDebug :samples:java:assembleDebug
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: android/unolink/build/reports

  ios:
    name: iOS SDK (tests on macOS + simulator, Swift and Objective-C samples)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Unit + contract-schema tests (macOS)
        run: swift test
      - name: Tests on the iOS simulator
        run: |
          set -o pipefail
          # Newest available iPhone simulator, from simctl's JSON (sturdier than parsing xcodebuild's text).
          DEST=$(xcrun simctl list devices available -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; rts=sorted([r for r in d if 'iOS' in r], key=lambda r: [int(x) for x in r.split('iOS-')[-1].split('-')]); print(next(x['udid'] for r in reversed(rts) for x in d[r] if x['name'].startswith('iPhone')))")
          echo "::notice::iOS simulator $DEST"
          xcodebuild test -scheme Unolink -destination "id=$DEST" 2>&1 | tee xcodebuild.log | grep -E "Executed|error:|failed" || true
          if ! grep -q "TEST SUCCEEDED" xcodebuild.log; then
            grep -E "error:|failed|Unable" xcodebuild.log | head -20 | while read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - name: Build the SwiftUI and Objective-C samples
        run: |
          brew install xcodegen
          cd ios/Examples && xcodegen
          for t in SwiftUISample ObjCSample; do
            xcodebuild -project UnolinkExamples.xcodeproj -scheme $t -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO -quiet build
          done

  react-native:
    name: React Native package (types, tests, codegen, pack)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: React Native codegen accepts the module spec (iOS and Android)
        run: |
          node node_modules/react-native/scripts/generate-codegen-artifacts.js -p . -o "$RUNNER_TEMP/codegen" -t ios
          node node_modules/react-native/scripts/generate-codegen-artifacts.js -p . -o "$RUNNER_TEMP/codegen" -t android
      - name: The packed package carries both native SDK cores
        run: |
          npm pack --silent
          tar -tzf unolink-react-native-*.tgz | grep -q "ios/UnolinkCore/Unolink.swift"
          tar -tzf unolink-react-native-*.tgz | grep -q "android/src/main/java/dev/unolink/core/Unolink.kt"

  flutter:
    name: Flutter plugin (analyze, tests, Android build of the example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Copy the native SDK cores into the plugin
        run: flutter/tool/sync_native.sh
      - name: Analyze and test
        working-directory: flutter
        run: flutter pub get && flutter analyze && flutter test
      - name: Build the example for Android
        working-directory: flutter/example
        run: flutter pub get && flutter analyze && flutter build apk --debug
