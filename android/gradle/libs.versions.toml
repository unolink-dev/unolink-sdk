[versions]
agp = "8.13.2"
kotlin = "2.1.20"
installreferrer = "2.2"
lifecycle = "2.8.7"
junit = "4.13.2"
orgjson = "20240303"
jsonschema = "1.5.6"

[libraries]
installreferrer = { module = "com.android.installreferrer:installreferrer", version.ref = "installreferrer" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
junit = { module = "junit:junit", version.ref = "junit" }
orgjson = { module = "org.json:json", version.ref = "orgjson" }
jsonschema = { module = "com.networknt:json-schema-validator", version.ref = "jsonschema" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
