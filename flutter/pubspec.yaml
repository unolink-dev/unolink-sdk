name: unolink
description: Unolink for Flutter. See which link or ad brings installs, onboarding, paywall views, trials and purchases.
version: 0.3.0
homepage: https://unolink.dev/docs
repository: https://github.com/unolink-dev/unolink-sdk/tree/main/flutter

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.unolink.flutter
        pluginClass: UnolinkFlutterPlugin
      ios:
        pluginClass: UnolinkFlutterPlugin
