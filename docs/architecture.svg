<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1238 1326" width="1238" height="1326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How the Unolink SDKs fit together</title>
<desc id="d">Your app tells the Unolink SDK when installs, onboarding screens, paywall views and purchases happen. The SDK saves them on the phone and sends them in small batches to the Unolink API, so you can see which link or ad brought each user, without fingerprinting.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
</defs>
<style>
  .edge { fill: none; stroke: #94A3B8; stroke-width: 2.4; stroke-dasharray: 8 7; animation: flow 1.6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -30; } }
  .lbl { font-size: 14px; font-weight: 600; fill: #334155; }
  @media (prefers-reduced-motion: reduce) { .edge { animation: none; } .dot { display: none; } }
</style>
<rect x="1" y="1" width="1236" height="1324" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<text x="44" y="70" font-size="34" font-weight="800" fill="#0F172A">How the Unolink SDKs fit together</text>
<text x="44" y="110" font-size="18" fill="#475569">Your app tells the Unolink SDK when installs, onboarding screens, paywall views and purchases</text>
<text x="44" y="134" font-size="18" fill="#475569">happen. The SDK saves them on the phone and sends them in small batches to the Unolink API, so you</text>
<text x="44" y="158" font-size="18" fill="#475569">can see which link or ad brought each user, without fingerprinting.</text>
<text x="44" y="206" font-size="14" font-weight="800" letter-spacing="1.6" fill="#94A3B8">YOUR APP</text>
<text x="44" y="422" font-size="14" font-weight="800" letter-spacing="1.6" fill="#94A3B8">SDK WRAPPERS</text>
<text x="44" y="638" font-size="14" font-weight="800" letter-spacing="1.6" fill="#94A3B8">PLATFORM SDKS</text>
<text x="44" y="854" font-size="14" font-weight="800" letter-spacing="1.6" fill="#94A3B8">SHARED EVENT ENGINE</text>
<text x="44" y="1070" font-size="14" font-weight="800" letter-spacing="1.6" fill="#94A3B8">STORAGE &amp; SERVICES</text>
